[package]
name = "background-computer-use"
version = "0.1.0"
edition = "2024"
description = "The engine (the agent monitor, the agents' windows, the focus guard and the named pipe), as a library, and the tray app that runs it."

[lib]
path = "src/lib.rs"

[[bin]]
name = "BackgroundComputerUse"
path = "src/main.rs"

[dependencies]
windows.workspace = true
png.workspace = true
serde_json.workspace = true
bcu-hook = { path = "../hook" }
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
