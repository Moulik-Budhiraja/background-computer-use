# Builds the Windows app and its installer the way a release does (without
# signing), and runs its tests, on pull requests that touch it.
name: Windows
on:
  pull_request:
    paths: ['windows/**', 'shared/**', 'skills/**', 'apps.json', '.github/workflows/windows.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build the installer
        shell: pwsh
        env:
          VERSION: 0.0.1
          # The release runner has no Rust; install it the way it will.
          BCU_FRESH_RUST: '1'
        run: ./windows/build.ps1
      - name: Test
        shell: pwsh
        working-directory: windows
        run: cargo test --locked -p background-computer-use -p bcu -p bcu-hook
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: windows/dist/*.exe
