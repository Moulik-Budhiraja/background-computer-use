# Builds the Windows app and its installer the way a release does (without
# signing), and runs its tests, on pull requests that touch it.
name: Windows
on:
  pull_request:
    paths: ['windows/**', 'shared/**', 'skills/**', 'apps.json', '.github/workflows/windows.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: [self-hosted, windows]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build the installer
        shell: pwsh
        env:
          VERSION: 0.0.1
          # The release runner has no Rust; install it the way it will.
          BCU_FRESH_RUST: '1'
        run: ./windows/build.ps1
      - name: Test
        shell: pwsh
        working-directory: windows
        # build.ps1 installed Rust under the temp folder (BCU_FRESH_RUST) and
        # put it on PATH for its own step only.
        run: |
          $tools = Join-Path ([IO.Path]::GetTempPath()) 'bcu-rust'
          if (Test-Path (Join-Path $tools 'cargo\bin\cargo.exe')) {
            $env:RUSTUP_HOME = Join-Path $tools 'rustup'
            $env:CARGO_HOME = Join-Path $tools 'cargo'
            $env:PATH = "$(Join-Path $env:CARGO_HOME 'bin');$env:PATH"
          }
          cargo test --locked -p background-computer-use -p bcu -p bcu-hook
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: windows/dist/*.exe
